name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-powershell:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Get version from tag
      id: get_version
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        version="${REF_NAME#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Tag '$REF_NAME' does not match v<major>.<minor>.<patch>"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Build PowerShell Module
      shell: pwsh
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        ./PowerShell/Build/build.ps1 -Version $env:VERSION

    - name: Upload PowerShell Module
      uses: actions/upload-artifact@v4
      with:
        name: PSMonitorTools-Module
        path: ./releases/PowerShell/PSMonitorTools-v${{ steps.get_version.outputs.version }}.zip

  build-csharp:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-x86]

    steps:
    - uses: actions/checkout@v7

    - name: Get version from tag
      id: get_version
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        version="${REF_NAME#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Tag '$REF_NAME' does not match v<major>.<minor>.<patch>"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Publish ${{ matrix.runtime }}
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        RUNTIME: ${{ matrix.runtime }}
      run: |
        dotnet publish CSharp/src/MonitorTools.CLI/MonitorTools.CLI.csproj `
          --configuration Release `
          --runtime $env:RUNTIME `
          --self-contained true `
          --output "releases/CSharp/$env:RUNTIME" `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:Version="$env:VERSION"

    - name: Upload C# CLI
      uses: actions/upload-artifact@v4
      with:
        name: MonitorTools-CLI-${{ matrix.runtime }}
        path: ./releases/CSharp/${{ matrix.runtime }}/MonitorTools.exe

  create-release:
    runs-on: windows-latest
    needs: [build-powershell, build-csharp]
    permissions:
      contents: write

    steps:
    - name: Download PowerShell Module
      uses: actions/download-artifact@v4
      with:
        name: PSMonitorTools-Module
        path: ./artifacts/powershell

    - name: Download C# CLI (win-x64)
      uses: actions/download-artifact@v4
      with:
        name: MonitorTools-CLI-win-x64
        path: ./artifacts/csharp/win-x64

    - name: Download C# CLI (win-x86)
      uses: actions/download-artifact@v4
      with:
        name: MonitorTools-CLI-win-x86
        path: ./artifacts/csharp/win-x86

    - name: Prepare release assets
      shell: pwsh
      run: |
        Copy-Item -Path "./artifacts/csharp/win-x64/MonitorTools.exe" -Destination "./artifacts/MonitorTools-win-x64.exe"
        Copy-Item -Path "./artifacts/csharp/win-x86/MonitorTools.exe" -Destination "./artifacts/MonitorTools-win-x86.exe"

    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        draft: false
        prerelease: false
        files: |
          ./artifacts/powershell/*.zip
          ./artifacts/MonitorTools-win-x64.exe
          ./artifacts/MonitorTools-win-x86.exe
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
