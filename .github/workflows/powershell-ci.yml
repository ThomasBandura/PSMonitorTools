name: PowerShell CI

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'PowerShell/**'
      - 'spec/**'
      - '.github/workflows/powershell-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'PowerShell/**'
      - 'spec/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pwsh = PowerShell 7, powershell = Windows PowerShell 5.1 (minimum version of the module)
        shell: [pwsh, powershell]
    name: test (${{ matrix.shell }})

    steps:
    - uses: actions/checkout@v7

    - name: Run Pester Tests (Unit Tests and Shared Behavior Spec)
      shell: pwsh
      env:
        TEST_SHELL: ${{ matrix.shell }}
      run: |
        # Coverage once, on PowerShell 7
        $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'PowerShell/Build/Invoke-CITests.ps1', '-InstallPester')
        if ($env:TEST_SHELL -eq 'pwsh') { $arguments += '-CodeCoverage' }
        & $env:TEST_SHELL @arguments
        exit $LASTEXITCODE

  build:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Build Module
      shell: pwsh
      run: |
        $manifestVersion = [version](Import-PowerShellDataFile ./PowerShell/PSMonitorTools/PSMonitorTools.psd1).ModuleVersion
        $version = "$($manifestVersion.Major).$($manifestVersion.Minor).$env:GITHUB_RUN_NUMBER"
        ./PowerShell/Build/build.ps1 -Version $version

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSMonitorTools-Module
        path: releases/PowerShell/*.zip
