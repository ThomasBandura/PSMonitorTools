name: PowerShell CI

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'PowerShell/**'
      - 'spec/**'
      - '.github/workflows/powershell-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'PowerShell/**'
      - 'spec/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pwsh = PowerShell 7, powershell = Windows PowerShell 5.1 (minimum version of the module)
        shell: [pwsh, powershell]
    name: test (${{ matrix.shell }})

    steps:
    - uses: actions/checkout@v7

    - name: Install Pester
      shell: ${{ matrix.shell }}
      run: |
        # -SkipPublisherCheck is required on Windows runners because the inbox Pester 3.x has a different publisher.
        Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

    - name: Run Pester Tests (Unit Tests and Shared Behavior Spec)
      shell: ${{ matrix.shell }}
      run: |
        Import-Module Pester -RequiredVersion 5.7.1
        $PSVersionTable.PSVersion
        $config = New-PesterConfiguration
        $config.Run.Path = @("PowerShell/Tests/Monitor.Tests.ps1", "PowerShell/Tests/Behavior.Spec.Tests.ps1")
        $config.Run.Exit = $true
        $config.Output.Verbosity = "Detailed"
        # Coverage once, on PowerShell 7
        $config.CodeCoverage.Enabled = ($PSVersionTable.PSEdition -eq 'Core')
        $config.CodeCoverage.Path = "PowerShell/PSMonitorTools/*.ps*1"
        Invoke-Pester -Configuration $config

  build:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Build Module
      shell: pwsh
      run: |
        $manifestVersion = [version](Import-PowerShellDataFile ./PowerShell/PSMonitorTools/PSMonitorTools.psd1).ModuleVersion
        $version = "$($manifestVersion.Major).$($manifestVersion.Minor).$env:GITHUB_RUN_NUMBER"
        ./PowerShell/Build/build.ps1 -Version $version

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSMonitorTools-Module
        path: releases/PowerShell/*.zip
